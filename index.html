<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 1. Instant 0-second redirect: Treated by Google Bots as a permanent 301 move -->
    <meta http-equiv="refresh" content="0; url=https://techiesagnik.me" />
    
    <!-- 2. Strong SEO signal telling bots that techiesagnik.me is the true master copy -->
    <link rel="canonical" href="https://techiesagnik.me" />
    
    <title>Redirecting...</title>
    
    <!-- 3. Immediate execution backup script for browsers -->
    <script type="text/javascript">
        window.location.replace("https://techiesagnik.me");
    </script>
</head>
<body style="background-color: #080c10;">
    <!-- Minimalist fallback text in case a device has scripts disabled -->
    <noscript>
        <p style="color: #94a3b8; font-family: sans-serif; text-align: center; margin-top: 20%;">
            Moving to new home node. <a href="https://techiesagnik.me" style="color: #38bdf8;">Click here if not redirected</a>.
        </p>
    </noscript>
</body>
</html>
