<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta refresh delay set to 3 seconds -->
    <meta http-equiv="refresh" content="3; url=https://techiesagnik.me" />
    <link rel="canonical" href="https://techiesagnik.me" />
    
    <title>⚡ Techie Sagnik | Central Portal Migration</title>
    
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            background-color: #080c10;
            color: #e2e8f0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Cyberpunk Terminal Card Wrapper */
        .cyber-card {
            background: linear-gradient(145deg, #0f172a, #0b1329);
            border: 2px solid #38bdf8;
            border-radius: 12px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.2), inset 0 0 15px rgba(56, 189, 248, 0.05);
            max-width: 440px;
            width: 90%;
            position: relative;
        }

        /* Top decorative line mimicking a software panel */
        .cyber-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 3px;
            background: #38bdf8;
            box-shadow: 0 0 10px #38bdf8;
        }

        .title-container {
            margin-bottom: 25px;
        }

        h2 {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            margin: 0 0 8px 0;
            text-transform: uppercase;
        }

        .highlight {
            color: #38bdf8;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
        }

        p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.5;
            margin: 0;
        }

        /* Techie Sagnik Portal Style Loading Buffering Element */
        .buffer-container {
            position: relative;
            width: 70px;
            height: 70px;
            margin: 0 auto 30px auto;
        }

        .outer-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px dashed rgba(56, 189, 248, 0.2);
            border-radius: 50%;
            animation: rotateClockwise 4s linear infinite;
        }

        .inner-spinner {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 60px;
            height: 60px;
            border: 4px solid transparent;
            border-top: 4px solid #38bdf8;
            border-right: 4px solid #38bdf8;
            border-radius: 50%;
            animation: rotateCounter 1s cubic-bezier(0.42, 0, 0.58, 1) infinite;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .center-dot {
            position: absolute;
            top: 27px;
            left: 27px;
            width: 16px;
            height: 16px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 15px #38bdf8;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes rotateClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotateCounter {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        /* Action Link Footer styling */
        .footer-nav {
            margin-top: 20px;
            border-top: 1px solid rgba(148, 163, 184, 0.1);
            padding-top: 20px;
            font-size: 13px;
            color: #64748b;
        }

        a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease, text-shadow 0.2s ease;
        }
        
        a:hover {
            color: #7dd3fc;
            text-shadow: 0 0 6px rgba(125, 211, 252, 0.4);
        }
    </style>
</head>
<body>

    <div class="cyber-card">
        <!-- Tech Lab Buffer Design -->
        <div class="buffer-container">
            <div class="outer-ring"></div>
            <div class="inner-spinner"></div>
            <div class="center-dot"></div>
        </div>
        
        <div class="title-container">
            <h2>System <span class="highlight">Rerouting</span></h2>
            <p>Initializing protocol link transfer to the new official hub...</p>
        </div>
        
        <div class="footer-nav">
            Bypassing old node. Manual override: 
            <a href="https://techiesagnik.me">ENTER CENTRAL PORTAL ➔</a>
        </div>
    </div>

    <!-- Scripted Redirection Backup (3 Second Trigger) -->
    <script type="text/javascript">
        setTimeout(function() {
            window.location.href = "https://techiesagnik.me";
        }, 3000);
    </script>
</body>
              </html>
